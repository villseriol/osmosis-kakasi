name: Deploy Package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Resolve Tag
        id: resolve-tag
        run: |
          TAG=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin." >&2
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  package-artifacts:
    needs: resolve-tag
    uses: ./.github/workflows/package-plugin-artifacts.yml

  create-release:
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - package-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Plugin Artifacts
        uses: actions/download-artifact@v8
        with:
          name: osmosis-transliterate-plugin
          path: artifacts
      - name: Download YAML Report Artifacts
        uses: actions/download-artifact@v8
        with:
          name: osmosis-transliterate-report-yaml
          path: artifacts
      - name: Download CSV Report Artifacts
        uses: actions/download-artifact@v8
        with:
          name: osmosis-transliterate-report-csv
          path: artifacts/csv
      # publish the per-range CSV reports as one release asset instead of one asset per file
      - name: Zip CSV Reports
        run: |
          cd artifacts/csv
          zip -q ../character-mapping-report-csv.zip *.csv
      - name: Create Tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ needs.resolve-tag.outputs.tag }}' -m 'Release ${{ needs.resolve-tag.outputs.tag }}'
          git push origin 'refs/tags/${{ needs.resolve-tag.outputs.tag }}'
      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            artifacts/*.jar
            artifacts/*-plugin.zip
            artifacts/character-mapping-report.yaml
            artifacts/character-mapping-report-csv.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  increment-version:
    needs: create-release
    uses: ./.github/workflows/increment-version.yml
    with:
      segment: minor
