name: Integration Tests
on: [pull_request]
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # install (not package) so the reports module can resolve the parent and plugin with -pl
      - name: Install
        run: mvn clean install

      - name: Generate Character Mapping Report
        run: mvn -pl osmosis-transliterate-reports exec:java@generate-character-mapping-report

      - name: Upload Character Mapping Report
        uses: actions/upload-artifact@v4
        with:
          name: character-mapping-report
          path: osmosis-transliterate-reports/target/reports/character-mapping-report.yaml
          retention-days: 7

      - name: Get Final Artifact Name
        id: get-final-name
        run: |
          FINAL_NAME=$(mvn -pl osmosis-transliterate help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)

          echo "final_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Install Osmosis
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmosis

      - name: Install Plugin
        run: |
          mkdir -p ~/.openstreetmap/osmosis/plugins
          cp osmosis-transliterate/target/${{ steps.get-final-name.outputs.final_name }}-plugin.zip \
            ~/.openstreetmap/osmosis/plugins

      - name: Verify Plugin Loads
        run: osmosis --read-empty --oss-tl-version-0.6
