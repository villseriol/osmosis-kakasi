name: Upload Package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # install (not package) so the reports module can resolve the parent and plugin with -pl
      - name: Install
        run: mvn clean install
      - name: Generate Character Mapping YAML Report
        run: mvn -pl osmosis-transliterate-reports exec:java@generate-character-mapping-report-yaml
      - name: Generate Character Mapping CSV Reports
        run: mvn -pl osmosis-transliterate-reports exec:java@generate-character-mapping-report-csv
      - name: Get Final Artifact Names
        id: get-final-name
        run: |
          FINAL_NAME=$(mvn -pl osmosis-transliterate help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)

          echo "final_name=$FINAL_NAME" >> $GITHUB_OUTPUT
      # each upload's paths share one parent directory, which upload-artifact uses as the artifact root
      - name: Upload Plugin Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: osmosis-transliterate-plugin
          path: |
            osmosis-transliterate/target/${{ steps.get-final-name.outputs.final_name }}.jar
            osmosis-transliterate/target/${{ steps.get-final-name.outputs.final_name }}-plugin.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload YAML Report Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: osmosis-transliterate-report-yaml
          path: osmosis-transliterate-reports/target/reports/character-mapping-report.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Upload CSV Report Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: osmosis-transliterate-report-csv
          path: osmosis-transliterate-reports/target/reports/csv/
          if-no-files-found: error
          retention-days: 7
