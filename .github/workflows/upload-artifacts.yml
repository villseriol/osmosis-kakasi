name: Upload Package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # install (not package) so the reports module can resolve the parent and plugin with -pl
      - name: Install
        run: mvn clean install
      - name: Generate Character Mapping Report
        run: mvn -pl osmosis-transliterate-reports exec:java@generate-character-mapping-report
      - name: Get Final Artifact Names
        id: get-final-name
        run: |
          FINAL_NAME=$(mvn -pl osmosis-transliterate help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)

          echo "final_name=$FINAL_NAME" >> $GITHUB_OUTPUT
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: osmosis-transliterate-artifacts
          path: |
            osmosis-transliterate/target/${{ steps.get-final-name.outputs.final_name }}.jar
            osmosis-transliterate/target/${{ steps.get-final-name.outputs.final_name }}-plugin.zip
            osmosis-transliterate-reports/target/reports/character-mapping-report.yaml
